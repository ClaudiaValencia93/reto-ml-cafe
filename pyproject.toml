[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "coffee-forecast"
version = "0.1.0"
description = "Analítica y pronóstico de consumo doméstico y precios del café — reto técnico NTT Data"
requires-python = ">=3.9"

# Dependencias de ejecución, sin fijar versión. La reproducibilidad exacta vive
# en requirements.txt, que sí las fija: son dos cosas distintas y se separan a
# propósito. pyproject declara con qué funciona el paquete; requirements declara
# con qué se construyó este resultado.
dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
    "pyarrow>=14",
    "scikit-learn>=1.3",
    "statsmodels>=0.14",
    "lightgbm>=4.0",
    "matplotlib>=3.7",
]

[project.optional-dependencies]
dev = ["pytest>=8", "jupyter"]
app = ["streamlit>=1.30", "fastapi>=0.110", "uvicorn>=0.27"]

# Layout src/: el código importable vive en src/coffee/, separado de notebooks,
# tests y datos. Evita que `import coffee` tome accidentalmente la carpeta del
# proyecto en vez del paquete instalado.
[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
